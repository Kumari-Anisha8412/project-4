<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A professional, modern, and intuitive Task Management & To-Do Application">
    <title>TaskMaster Pro &mdash; Smart Daily Planner</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- App Container -->
    <div class="app-wrapper">
        <!-- Header -->
        <header class="app-header">
            <div class="header-brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M9 11l3 3L22 4"></path>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="brand-title">TaskMaster <span class="badge-pro">PRO</span></h1>
                    <p class="brand-subtitle" id="currentDateDisplay">Organize your workflow & accomplish more</p>
                </div>
            </div>

            <div class="header-actions">
                <button id="themeToggleBtn" class="icon-btn" aria-label="Toggle Theme" title="Toggle Dark/Light Mode">
                    <!-- Sun Icon -->
                    <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <!-- Moon Icon -->
                    <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Stats Overview Cards -->
        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-info">
                    <span class="stat-label">Total Tasks</span>
                    <span class="stat-value" id="statTotal">0</span>
                </div>
                <div class="stat-icon total-bg">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-info">
                    <span class="stat-label">Pending</span>
                    <span class="stat-value" id="statPending">0</span>
                </div>
                <div class="stat-icon pending-bg">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-info">
                    <span class="stat-label">Completed</span>
                    <span class="stat-value" id="statCompleted">0</span>
                </div>
                <div class="stat-icon completed-bg">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-info">
                    <span class="stat-label">Efficiency</span>
                    <span class="stat-value" id="statRate">0%</span>
                </div>
                <div class="stat-icon rate-bg">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="20" x2="18" y2="10"></line>
                        <line x1="12" y1="20" x2="12" y2="4"></line>
                        <line x1="6" y1="20" x2="6" y2="14"></line>
                    </svg>
                </div>
            </div>
        </section>

        <!-- Progress Bar -->
        <div class="progress-container">
            <div class="progress-bar-wrap">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
            <span class="progress-text" id="progressText">0% Completed</span>
        </div>

        <!-- Task Creator Form Card -->
        <section class="card creator-card">
            <div class="card-header">
                <h2 class="card-title" id="formHeading">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="title-icon">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="16"></line>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                    Create New Task
                </h2>
                <button type="button" id="cancelEditBtn" class="btn btn-outline btn-sm hidden">
                    Cancel Edit
                </button>
            </div>

            <form id="taskForm" autocomplete="off">
                <div class="form-row">
                    <div class="form-group flex-grow">
                        <label for="taskInput">Task Description *</label>
                        <input type="text" id="taskInput"
                            placeholder="What needs to be done? (e.g., Complete project report)" required>
                    </div>
                </div>

                <div class="form-row form-grid-3">
                    <div class="form-group">
                        <label for="category">Category</label>
                        <div class="select-wrapper">
                            <select id="category">
                                <option value="Work">💼 Work</option>
                                <option value="Study">📚 Study</option>
                                <option value="Personal">🏡 Personal</option>
                                <option value="Health">💪 Health & Fitness</option>
                                <option value="Finance">💰 Finance</option>
                                <option value="Other">📌 Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="priority">Priority</label>
                        <div class="select-wrapper">
                            <select id="priority">
                                <option value="Medium">⚡ Medium</option>
                                <option value="High">🔥 High</option>
                                <option value="Low">🌱 Low</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="taskDate">Due Date</label>
                        <input type="date" id="taskDate">
                    </div>
                </div>

                <div class="form-row form-grid-2">
                    <div class="form-group">
                        <label for="taskTime">Due Time</label>
                        <input type="time" id="taskTime">
                    </div>
                    <div class="form-group form-actions-group">
                        <label class="invisible-label">Action</label>
                        <button type="submit" id="addButton" class="btn btn-primary btn-block">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            <span id="btnText">Add Task</span>
                        </button>
                    </div>
                </div>
            </form>
        </section>

        <!-- Task Management Toolbar (Search, Filters, Sort) -->
        <section class="card toolbar-card">
            <div class="search-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="search-icon">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="Search tasks by name or category...">
                <button type="button" id="clearSearchBtn" class="clear-btn hidden" title="Clear Search">&times;</button>
            </div>

            <div class="toolbar-controls">
                <div class="filter-tabs">
                    <button class="filter-btn active" data-filter="All">All</button>
                    <button class="filter-btn" data-filter="Pending">Pending</button>
                    <button class="filter-btn" data-filter="Completed">Completed</button>
                    <button class="filter-btn" data-filter="Today">Today</button>
                </div>

                <div class="toolbar-dropdowns">
                    <select id="filterCategory" class="toolbar-select" title="Filter by category">
                        <option value="All">All Categories</option>
                        <option value="Work">💼 Work</option>
                        <option value="Study">📚 Study</option>
                        <option value="Personal">🏡 Personal</option>
                        <option value="Health">💪 Health</option>
                        <option value="Finance">💰 Finance</option>
                        <option value="Other">📌 Other</option>
                    </select>

                    <select id="sortBy" class="toolbar-select" title="Sort tasks">
                        <option value="newest">🕒 Newest First</option>
                        <option value="oldest">⌛ Oldest First</option>
                        <option value="priority">🔥 Highest Priority</option>
                        <option value="date">📅 Due Date</option>
                        <option value="alphabetical">🔤 Title (A-Z)</option>
                    </select>
                </div>
            </div>

            <!-- Bulk actions & export/import bar -->
            <div class="toolbar-footer">
                <div class="bulk-info">
                    <span id="taskCount">Showing 0 tasks</span>
                </div>
                <div class="bulk-actions">
                    <button id="markAllCompletedBtn" class="btn-text" title="Mark all displayed tasks as complete">
                        ✓ Mark All Done
                    </button>
                    <button id="clearCompletedBtn" class="btn-text btn-danger-text" title="Delete all completed tasks">
                        🗑 Clear Completed
                    </button>
                    <button id="exportTasksBtn" class="btn-text" title="Export tasks to JSON file">
                        📥 Export
                    </button>
                    <label class="btn-text" title="Import tasks from JSON file">
                        📤 Import
                        <input type="file" id="importFileInput" accept=".json" style="display:none;">
                    </label>
                </div>
            </div>
        </section>

        <!-- Task List Area -->
        <main class="tasks-container">
            <ul id="taskList" class="task-list" aria-label="Task List">
                <!-- Dynamically rendered tasks will appear here -->
            </ul>

            <!-- Empty State Placeholder -->
            <div id="emptyState" class="empty-state hidden">
                <div class="empty-illustration">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"></path>
                        <path d="M8 12l3 3 5-5"></path>
                    </svg>
                </div>
                <h3 class="empty-title">All Caught Up!</h3>
                <p class="empty-subtitle">You have no tasks matching this filter. Relax or add a new goal!</p>
            </div>
        </main>
    </div>

    <!-- Custom Confirmation Modal (Replaces native browser confirm dialog) -->
    <div id="confirmModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-card">
            <div class="modal-icon-wrap" id="modalIconWrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                    </path>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
            </div>
            <h3 id="modalTitle" class="modal-title">Confirm Action</h3>
            <p id="modalMessage" class="modal-message">Are you sure you want to proceed?</p>
            <div class="modal-actions">
                <button type="button" id="modalCancelBtn" class="btn btn-outline">Cancel</button>
                <button type="button" id="modalConfirmBtn" class="btn btn-danger">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification Container (Replaces native alert) -->
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <!-- Application Script -->
    <script src="script.js"></script>
</body>

</html>
